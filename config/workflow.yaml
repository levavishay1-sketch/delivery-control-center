# Delivery Control Center — SDD pipeline definition.
#
# This file is the single source of truth for the pipeline shape. Nothing in
# the app code hardcodes stage order or gate rules — lib/config.ts loads this
# at runtime, so changing the pipeline means editing this file, not the code.

# Slice 2 — CONSTITUTION is deliberately not a stage here: it's promoted to a
# project-scoped, versioned artifact drafted/approved once per project (see
# src/domain/constitution/), referenced by every pipeline started under it via
# Pipeline.constitutionVersion, rather than drafted per work item. ANALYZE and
# IMPLEMENT joined this list once their prompt templates existed (Task Groups
# 7 and 11) — IMPLEMENT stays an AI-drafted document, not real code execution
# (design.md's Non-Goals), mechanically identical to DEPLOY below it.
#
# approverRoles (Task Group 8): an explicit list of roles allowed to
# approve/reject that stage's gate — not a hierarchy (design.md Decision 6).
# MANAGER is included in every list by convention. Required (and validated
# non-empty by lib/config.ts) for every requiresApproval: true stage; omitted
# for auto-completing stages, which have no human gate to approve.
stages:
  - type: SPEC
    label: Specification
    description: What is being built and why, from the work item's intent.
    promptTemplate: spec.md
    requiresApproval: true
    approverRoles: [PROJECT_MANAGER, MANAGER]

  - type: CLARIFY
    label: Clarify
    description: Structured questions for a human when the AI lacks information it needs, instead of guessing.
    promptTemplate: clarify.md
    requiresApproval: false

  - type: PLAN
    label: Plan
    description: The technical approach and architecture for implementing the SPEC.
    promptTemplate: plan.md
    requiresApproval: true
    approverRoles: [TECH_LEAD, MANAGER]

  - type: TASKS
    label: Tasks
    description: Concrete, ordered implementation tasks derived from the Plan.
    promptTemplate: tasks.md
    requiresApproval: true
    approverRoles: [TECH_LEAD, MANAGER]

  - type: ANALYZE
    label: Analyze
    description: Read-only consistency check across the Spec, Plan, and Tasks. A Critical finding blocks advancing until the flagged stage is redrafted.
    promptTemplate: analyze.md
    requiresApproval: false

  - type: IMPLEMENT
    label: Implement
    description: A record of what was built for each Task, once Analyze is clean.
    promptTemplate: implement.md
    requiresApproval: true
    approverRoles: [TECH_LEAD, MANAGER]

  - type: DEPLOY
    label: Deploy
    description: Deployment/rollout record for the completed work.
    promptTemplate: deploy.md
    requiresApproval: true
    approverRoles: [TECH_LEAD, MANAGER]
